    <script>



        function getCookie(name) {
            let matches = document.cookie.match(new RegExp(
                "(?:^|; )" + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + "=([^;]*)"
            ));
            return matches ? decodeURIComponent(matches[1]) : undefined;
        }

        let bookings = [];
        let canManageBookings = false;
        let bookingPage = 1, bookingLoaded = false, bookingLoading = false;
        const bookingPageSize = 10;
        const normalizedStatus = value => ['confirm','confirmed'].includes(String(value).toLowerCase()) ? 'confirmed' : ['cancel','cancelled'].includes(String(value).toLowerCase()) ? 'cancelled' : 'pending';
        const bookingDate = value => new Date(String(value || '').replace(' ', 'T'));

        function renderTable(data = bookings) {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.parentNode.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            } else {
                tbody.parentNode.classList.remove('hidden');
                emptyState.classList.add('hidden');
            }

            data.forEach(raw => {
                const booking = escapeRecord(raw);
                const start = bookingDate(raw.start_datetime);
                const end = bookingDate(raw.end_datetime);
                const dateOptions = { year: 'numeric', month: 'short', day: 'numeric' };
                const timeOptions = { hour: '2-digit', minute: '2-digit' };

                const isSameDay = start.toDateString() === end.toDateString();
                let dateTimeHtml = '';

                if (isSameDay) {
                    // กรณีวันเดียวกัน แยกบรรทัดวันที่ และบรรทัดช่วงเวลาออกจากกัน
                    const dateStr = start.toLocaleDateString('th-TH', dateOptions);
                    const timeStr = `${start.toLocaleTimeString('th-TH', timeOptions)} - ${end.toLocaleTimeString('th-TH', timeOptions)} น.`;
                    dateTimeHtml = `
                        <div class="text-gray-900 font-medium">${dateStr}</div>
                        <div class="text-gray-500 text-xs mt-0.5"><i class="ph ph-clock inline-block align-middle mr-0.5 text-indigo-500"></i> ${timeStr}</div>
                    `;
                } else {
                    // กรณีคนละวัน แยกข้อมูลเริ่มต้นและสิ้นสุด โดยในแต่ละกลุ่มแยกบรรทัด วัน และ เวลา ออกจากกันชัดเจน
                    const startDateStr = start.toLocaleDateString('th-TH', dateOptions);
                    const endDateStr = end.toLocaleDateString('th-TH', dateOptions);
                    const startTimeStr = start.toLocaleTimeString('th-TH', timeOptions);
                    const endTimeStr = end.toLocaleTimeString('th-TH', timeOptions);
                    dateTimeHtml = `
                        <div class="space-y-1.5">
                            <div>
                                <div class="text-gray-900 text-xs font-medium"><span class="text-indigo-600 font-semibold">เริ่ม:</span> ${startDateStr}</div>
                                <div class="text-gray-500 text-[11px] pl-7">เวลา ${startTimeStr} น.</div>
                            </div>
                            <div>
                                <div class="text-gray-900 text-xs font-medium"><span class="text-rose-600 font-semibold">ถึง:</span> ${endDateStr}</div>
                                <div class="text-gray-500 text-[11px] pl-7">เวลา ${endTimeStr} น.</div>
                            </div>
                        </div>
                    `;
                }

                let eqHtml = '<div class="flex gap-1 flex-wrap">';
                if(booking.equipment_audio == 1) eqHtml += `<span class="booking-equipment">เครื่องเสียง</span>`;
                if(booking.equipment_computer == 1) eqHtml += `<span class="booking-equipment">คอมพิวเตอร์</span>`;
                if(booking.equipment_projector == 1) eqHtml += `<span class="booking-equipment">โปรเจคเตอร์</span>`;
                if(booking.equipment_food == 1) eqHtml += `<span class="booking-equipment">อาหาร/เครื่องดื่ม</span>`;
                if(booking.equipment_other) eqHtml += `<span class="booking-equipment">${booking.equipment_other}</span>`;
                if(eqHtml === '<div class="flex gap-1 flex-wrap">') eqHtml += '<span class="text-gray-400 text-xs">- ไม่มี -</span>';
                eqHtml += '</div>';

                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/50 transition-colors group";
                tr.innerHTML = `
                    <td class="px-6 py-4">
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">${booking.room_name}</div>
                    </td>
                    <td class="px-6 py-4 max-w-[550px]">
                        <div class="text-gray-800 break-words overflow-hidden">${booking.topic}</div>
                        <div class="text-xs text-gray-500 mt-1 flex items-center gap-1">
                             <i class="ph ph-users"></i> ผู้เข้าร่วม <span class="font-medium text-indigo-600">${booking.attendees || 0} คน</span>
                        </div>
                        <div class="booking-requester text-gray-600">ผู้จอง: ${booking.requester_name || '-'}</div>
                    </td>

                    <td class="px-6 py-4">
                        ${dateTimeHtml}
                    </td>
                    <td class="px-2 py-4  w-[150px]">
                        ${eqHtml}
                    </td>
                    <td class="px-2 py-4 text-center w-[110px]">
                        <div class="flex items-center justify-center gap-1.5">
                            <button onclick="openEditModal('${booking.id}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-indigo-600 bg-indigo-50 hover:bg-indigo-600 hover:text-white transition-colors" title="แก้ไข" aria-label="แก้ไขการจอง">
                                <i class="ph ph-pencil-simple text-lg" aria-hidden="true"></i><span>แก้ไข</span>
                            </button>
                            <button onclick="printSlip('${booking.id}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-emerald-600 bg-emerald-50 hover:bg-emerald-600 hover:text-white transition-colors" title="พิมพ์ใบจอง" aria-label="พิมพ์ใบจอง">
                                <i class="ph ph-printer text-lg" aria-hidden="true"></i><span>พิมพ์ใบจอง</span>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
                tr.insertBefore(tr.cells[3], tr.cells[2]);
                [...tr.cells].forEach((cell,index) => cell.dataset.label = ['สถานะ','ห้องประชุม','วันและเวลาใช้งาน','หัวข้อการประชุม','อุปกรณ์','จัดการ'][index]);
                const status = normalizedStatus(raw.status);
                if (end < new Date() && status !== 'cancelled') {
                    const ended = document.createElement('span');
                    ended.className = 'booking-ended';
                    ended.textContent = 'สิ้นสุดแล้ว';
                    tr.cells[2].append(ended);
                }
                const statusLabels = {pending:'รอดำเนินการ',confirmed:'อนุมัติแล้ว',cancelled:'ยกเลิกแล้ว'};
                const badge = document.createElement('span');
                badge.className = 'booking-status booking-status--' + status;
                badge.textContent = statusLabels[status];
                if (!canManageBookings) tr.cells[0].append(badge);
                const created = bookingDate(raw.created_at);
                if (!isNaN(created)) {
                    const note = document.createElement('small');
                    note.className = 'booking-created';
                    note.textContent = 'สร้างรายการ ' + created.toLocaleDateString('th-TH', {day:'numeric',month:'short',year:'numeric'});
                    tr.cells[0].append(note);
                }
                if (canManageBookings) {
                    const select = document.createElement('select');
                    select.setAttribute('aria-label', 'เปลี่ยนสถานะการจอง: ' + raw.topic);
                    const field = document.createElement('div');
                    field.className = 'booking-status-field';
                    const hint = document.createElement('span');
                    hint.id = 'booking-status-hint-' + raw.id;
                    hint.className = 'booking-status-hint';
                    hint.setAttribute('role', 'tooltip');
                    hint.textContent = 'เปลี่ยนสถานะการจอง';
                    select.setAttribute('aria-describedby', hint.id);
                    for (const [value,label] of Object.entries(statusLabels)) select.add(new Option(label,value));
                    select.value = status;
                    select.className = 'booking-status-control booking-status--' + status;
                    select.addEventListener('change', () => changeStatus(raw.id,status,select));
                    field.append(select, hint);
                    tr.cells[0].prepend(field);
                }
            });
        }

        async function changeStatus(id, currentStatus, control) {
            await window.sessionReady;
            if (!canManageBookings) return;
            const nextStatus = control.value;
            if (!window.confirm('ยืนยันเปลี่ยนสถานะการจองเป็น “' + control.selectedOptions[0].textContent + '” หรือไม่?')) { control.value = currentStatus; return; }
            control.disabled = true;

            try {
                const response = await fetch('api/update_status.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify({
                        id: parseInt(id),
                        status: nextStatus
                    })
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    const index = bookings.findIndex(b => String(b.id) === String(id));
                    if (index !== -1) {
                        bookings[index].status = nextStatus;
                    }
                    filterBookings();
                    showToast('เปลี่ยนสถานะเรียบร้อยแล้ว', 'success');
                } else {
                    showToast(result.message || 'เกิดข้อผิดพลาดในการเปลี่ยนสถานะ', 'error');
                }
            } catch (error) {
                console.error('Error changing status:', error);
                showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            } finally {
                control.value = normalizedStatus(bookings.find(b => String(b.id) === String(id))?.status || currentStatus);
                control.className = 'booking-status-control booking-status--' + control.value;
                control.disabled = false;
            }
        }

        const modal = document.getElementById('editModal');
        const modalContent = modal.querySelector('.bg-white');
        let editTrigger;
        let editGeneration = 0, editRevision = 0, editSaving = false;
        const editForm = document.getElementById('editForm');
        const editSnapshot = () => JSON.stringify([...editForm.elements].map(node =>
            [node.id, node.type === 'checkbox' ? node.checked : node.value]));
        for (const type of ['input', 'change']) editForm.addEventListener(type, () => { editRevision++; });

        function formatDatetimeForInput(dtString) {
            if(!dtString) return '';
            const cleanDt = dtString.replace(' ', 'T');
            const dt = new Date(cleanDt);
            if (isNaN(dt.getTime())) return '';
            dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset());
            return dt.toISOString().slice(0,16);
        }

        // [เพิ่มจุดที่ 2] ฟังก์ชันควบคุมจัดการข้อความอัตโนมัติเมื่อกดติ๊กเข้า/ออกช่อง LED โดยรักษาค่าที่ผู้ใช้พิมพ์เพิ่มเองไว้
        function toggleLedEquip() {
            const isChecked2 = document.getElementById('edit_eq_led1').checked;
            const isChecked3 = document.getElementById('edit_eq_led2').checked;
            const input = document.getElementById('edit_eq_other');

            const text2 = 'จอ LED (ขึ้นภาพนิ่งหรือพื้นหลังเท่านั้น)';
            const text3 = 'จอ LED (เปิดไฟล์อื่นๆ เพื่อประกอบการอบรม/ประชุม)';

            let currentValue = input.value;
            // ดึงข้อความระบบ (LED) ชุดเก่าออกไปเพื่อแยกส่วนคำนวณใหม่
            currentValue = currentValue.replace(text2, '').replace(text3, '');

            // แปลงข้อความที่ผู้ใช้พิมพ์ไว้เองให้กลายเป็น Array เพื่อความสะอาดของข้อความ
            let items = currentValue.split(',')
                .map(item => item.trim())
                .filter(item => item !== '');

            // ตรวจสอบสถานะการติ๊กของปัจจุบันแล้วเติมข้อมูลต่อท้ายเข้าไปใหม่ตามจริง
            if (isChecked2) {
                items.push(text2);
            }
            if (isChecked3) {
                items.push(text3);
            }

            // นำ Array กลับมารวมเป็น String คั่นด้วยเครื่องหมายจุลภาคอย่างเป็นระเบียบ
            input.value = items.join(', ');
        }

        function openEditModal(id) {
            const booking = bookings.find(b => String(b.id) === String(id));

            if (!booking) {
                console.error("หา ID ข้อมูลไม่เจอ:", id);
                return;
            }

            editTrigger = modal.getRootNode?.().activeElement || document.activeElement;
            editGeneration++; editRevision = 0;
            editForm.dispatchEvent(new Event('eoffice:form-saved', {bubbles:true}));
            document.getElementById('edit_id').value = booking.id;

            const roomSelect = document.getElementById('edit_room_name');
            roomSelect.value = booking.room_name;
            if (roomSelect.selectedIndex === -1) {
                const opt = document.createElement('option');
                opt.value = booking.room_name;
                opt.text = booking.room_name;
                opt.selected = true;
                roomSelect.add(opt);
            }

            document.getElementById('edit_topic').value = booking.topic;
            document.getElementById('edit_requester_name').value = booking.requester_name;
            document.getElementById('edit_department').value = booking.department;
            document.getElementById('edit_attendees').value = booking.attendees || '';

            document.getElementById('edit_start_datetime').value = formatDatetimeForInput(booking.start_datetime);
            document.getElementById('edit_end_datetime').value = formatDatetimeForInput(booking.end_datetime);

            document.getElementById('edit_eq_audio').checked = (booking.equipment_audio == 1);
            document.getElementById('edit_eq_computer').checked = (booking.equipment_computer == 1);
            document.getElementById('edit_eq_projector').checked = (booking.equipment_projector == 1);
            document.getElementById('edit_eq_food').checked = (booking.equipment_food == 1);

            // [เพิ่มจุดที่ 3] ตรวจสอบความถูกต้องและสั่งงานติ๊กของปุ่ม จอ LED เมื่อโหลดฟอร์มแก้ไขขึ้นมาใหม่
            const otherText = booking.equipment_other || '';
            const text2 = 'จอ LED (ขึ้นภาพนิ่งหรือพื้นหลังเท่านั้น)';
            const text3 = 'จอ LED (เปิดไฟล์อื่นๆ เพื่อประกอบการอบรม/ประชุม)';

            document.getElementById('edit_eq_led1').checked = otherText.includes(text2);
            document.getElementById('edit_eq_led2').checked = otherText.includes(text3);
            document.getElementById('edit_eq_other').value = otherText;

            modal.classList.remove('hidden');
            const generation = editGeneration;
            setTimeout(() => {
                if (generation !== editGeneration) return;
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
                document.getElementById('edit_room_name').focus?.();
            }, 10);
        }

        function closeModal() {
            const generation = ++editGeneration;
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');

            setTimeout(() => {
                if (generation !== editGeneration) return;
                modal.classList.add('hidden');
                document.getElementById('editForm').reset();
                if (editTrigger?.isConnected) editTrigger.focus();
                else document.getElementById('searchInput')?.focus?.();
            }, 300);
        }

        async function saveChanges() {
            if (editSaving) return;
            const id = document.getElementById('edit_id').value;
            const room_name = document.getElementById('edit_room_name').value;
            const topic = document.getElementById('edit_topic').value;
            const requester_name = document.getElementById('edit_requester_name').value;
            const start_datetime = document.getElementById('edit_start_datetime').value;
            const end_datetime = document.getElementById('edit_end_datetime').value;
            const department = document.getElementById('edit_department').value;
            const attendees = document.getElementById('edit_attendees').value;

            if (editForm.reportValidity && !editForm.reportValidity()) return;
            if(!room_name || !topic.trim() || !requester_name.trim() || !department.trim() || !start_datetime || !end_datetime || Number(attendees) < 1) {
                showToast('กรุณากรอกข้อมูลที่จำเป็นให้ครบถ้วน', 'error');
                return;
            }
            if(new Date(start_datetime) >= new Date(end_datetime)){
                showToast('เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น', 'error');
                return;
            }

            const payload = {
                id: parseInt(id),
                room_name: room_name,
                topic: topic,
                requester_name: requester_name,
                start_datetime: start_datetime.replace('T', ' ') + ':00',
                end_datetime: end_datetime.replace('T', ' ') + ':00',
                equipment_audio: document.getElementById('edit_eq_audio').checked ? 1 : 0,
                equipment_computer: document.getElementById('edit_eq_computer').checked ? 1 : 0,
                equipment_projector: document.getElementById('edit_eq_projector').checked ? 1 : 0,
                equipment_food: document.getElementById('edit_eq_food').checked ? 1 : 0,
                equipment_other: document.getElementById('edit_eq_other').value, // ดึงค่าจากกล่องข้อความไปเซฟเข้า Database ได้โดยตรง
                department: document.getElementById('edit_department').value,
                attendees: parseInt(attendees) || 0
            };

            const submitted = {generation:editGeneration, revision:editRevision, snapshot:editSnapshot()};
            editSaving = true;
            document.getElementById('save-booking-changes').disabled = true;
            try {
                const response = await fetch('api/update_booking.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json; charset=UTF-8'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok && result.status === 'success') {
                    const index = bookings.findIndex(b => String(b.id) === String(payload.id));
                    if(index !== -1) {
                        bookings[index] = { ...bookings[index], ...payload };
                    }
                    filterBookings();
                    const current = submitted.generation === editGeneration && submitted.revision === editRevision && submitted.snapshot === editSnapshot();
                    if (current) {
                        editForm.dispatchEvent(new Event('eoffice:form-saved', {bubbles:true}));
                        closeModal();
                    }
                    showToast(current ? (result.message || 'บันทึกข้อมูลสำเร็จ') : 'บันทึกข้อมูลที่ส่งไปแล้ว โดยเก็บฟอร์มปัจจุบันไว้ กรุณาบันทึกการแก้ไขเพิ่มเติม', 'success');
                } else {
                    showToast(result.message || 'เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'error');
                }
            } catch (error) {
                console.error('Error updating data:', error);
                showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์เพื่อบันทึกข้อมูลได้', 'error');
            } finally {
                editSaving = false;
                document.getElementById('save-booking-changes').disabled = false;
            }
        }

        function printSlip(id) {
            const source = bookings.find(b => String(b.id) === String(id));
            const booking = source ? escapeRecord(source) : null;
            if (!booking) return;

            const start = new Date(booking.start_datetime);
            const end = new Date(booking.end_datetime);
            const thMonths = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

            const startStr = `${start.getDate()} ${thMonths[start.getMonth()]} ${start.getFullYear() + 543} เวลา ${start.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})} น.`;
            const endStr = `${end.getDate()} ${thMonths[end.getMonth()]} ${end.getFullYear() + 543} เวลา ${end.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})} น.`;

            let eqList = [];
            if(booking.equipment_audio == 1) eqList.push('เครื่องเสียง/ไมค์');
            if(booking.equipment_computer == 1) eqList.push('คอมพิวเตอร์');
            if(booking.equipment_projector == 1) eqList.push('โปรเจคเตอร์');
            if(booking.equipment_food == 1) eqList.push('อาหาร/เครื่องดื่ม');
            if(booking.equipment_other) eqList.push(booking.equipment_other);
            const eqStr = eqList.length > 0 ? eqList.join(', ') : '- ไม่มี -';

            const printTimeStr = new Date().toLocaleString('th-TH', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' น.';

            const printWindow = window.open('', '_blank');
            if (!printWindow) { showToast('กรุณาอนุญาตหน้าต่างป๊อปอัปเพื่อพิมพ์ใบจอง', 'error'); return; }
            printWindow.document.write(`
                <html>
                <head>
                    <title>ใบสรุปการจอง - ${booking.topic}</title>
                    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
                    <style>
                        body { font-family: 'Prompt', sans-serif; padding: 40px; color: #333; line-height: 1.6; }
                        .ticket { max-width: 650px; margin: 0 auto; border: 2px dashed #cbd5e1; padding: 30px; border-radius: 12px; }
                        .title { text-align: center; font-size: 22px; font-weight: 600; color: #4f46e5; margin-bottom: 5px; }
                        .print-time { text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 2px solid #f3f4f6; }
                        .row { display: flex; margin-bottom: 12px; align-items: flex-start; }
                        .label { width: 180px; font-weight: 500; color: #6b7280; flex-shrink: 0; }
                        .value { flex: 1; color: #111827; }
                        .footer { margin-top: 30px; text-align: center; font-size: 11px; color: #9ca3af; border-top: 1px solid #f3f4f6; padding-top: 10px; }
                    </style>
                </head>
                <body>
                    <div class="ticket">
                        <div class="title">รายละเอียดการจองสถานที่</div>
                        <div class="print-time">เวลาที่พิมพ์เอกสาร: ${printTimeStr}</div>
                        <div class="row"><div class="label">หัวข้อการประชุม/กิจกรรม:</div><div class="value" style="font-weight:600; color:#4f46e5;">${booking.topic}</div></div>
                        <div class="row"><div class="label">ห้องประชุม:</div><div class="value">${booking.room_name}</div></div>
                        <div class="row"><div class="label">ผู้ขออนุญาต:</div><div class="value">${booking.requester_name}</div></div>
                        <div class="row"><div class="label">ฝ่ายงาน/แผนก:</div><div class="value">${booking.department || '-'}</div></div>
                        <div class="row"><div class="label">จำนวนผู้มาใช้บริการ:</div><div class="value" style="font-weight:600;">${booking.attendees || 0} คน</div></div>
                        <div class="row"><div class="label">เวลาเริ่มต้น:</div><div class="value">${startStr}</div></div>
                        <div class="row"><div class="label">เวลาสิ้นสุด:</div><div class="value">${endStr}</div></div>
                        <div class="row"><div class="label">อุปกรณ์เสริม:</div><div class="value">${eqStr}</div></div>
                        <div class="footer">ระบบจัดการจองห้องประชุมออนไลน์ - Booking ID: ${booking.id}</div>
                    </div>
                    <script>
                        window.onload = function() { window.print(); setTimeout(function(){ window.close(); }, 500); }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        }

        let toastTimeout;
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const icon = toast.querySelector('i');

            msgEl.textContent = message;

            if (type === 'error') {
                toast.classList.replace('bg-green-500', 'bg-red-500');
                icon.className = 'ph ph-warning-circle text-2xl';
            } else {
                toast.classList.replace('bg-red-500', 'bg-green-500');
                icon.className = 'ph ph-check-circle text-2xl';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function filterBookings() {
            const keyword = document.getElementById('searchInput').value.trim().toLocaleLowerCase('th');
            const status = document.getElementById('statusFilter').value;
            const period = document.getElementById('periodFilter').value;
            const now = new Date(), today = new Date(now.getFullYear(),now.getMonth(),now.getDate()), tomorrow = new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
            const filteredData = bookings.filter(b => {
                const start = bookingDate(b.start_datetime), end = bookingDate(b.end_datetime);
                return [b.topic,b.room_name,b.requester_name,b.department].some(value => String(value || '').toLocaleLowerCase('th').includes(keyword)) &&
                    (status === 'all' || normalizedStatus(b.status) === status) &&
                    (period === 'all' || (period === 'upcoming' && end >= now) || (period === 'past' && end < now) || (period === 'today' && start < tomorrow && end >= today));
            }).sort((a,b) => (bookingDate(a.start_datetime) - bookingDate(b.start_datetime)) * (document.getElementById('sortFilter').value === 'soonest' ? 1 : -1) || Number(b.id)-Number(a.id));
            const pages = Math.max(1,Math.ceil(filteredData.length / bookingPageSize));
            bookingPage = Math.min(bookingPage,pages);
            renderTable(filteredData.slice((bookingPage-1)*bookingPageSize,bookingPage*bookingPageSize));
            document.getElementById('resultCount').textContent = bookingLoading ? 'กำลังโหลดรายการ…' : filteredData.length.toLocaleString('th-TH') + ' รายการ';
            document.getElementById('pageInfo').textContent = filteredData.length ? `แสดง ${(bookingPage-1)*bookingPageSize+1}–${Math.min(bookingPage*bookingPageSize,filteredData.length)} จาก ${filteredData.length} รายการ` : 'ไม่มีรายการที่จะแสดง';
            document.getElementById('pageNumber').textContent = `${bookingPage} / ${pages}`;
            document.getElementById('previousPage').disabled = bookingPage <= 1;
            document.getElementById('nextPage').disabled = bookingPage >= pages;
            const filtered = !!keyword || status !== 'all' || period !== 'all';
            document.getElementById('emptyTitle').textContent = !bookingLoaded ? 'ยังไม่สามารถแสดงรายการได้' : filtered ? 'ไม่พบรายการที่ตรงกับตัวกรอง' : 'ยังไม่มีรายการจองห้องประชุม';
            document.getElementById('emptyDescription').textContent = !bookingLoaded ? 'กดโหลดใหม่เพื่อลองอีกครั้ง' : filtered ? 'ลองเปลี่ยนคำค้น สถานะ หรือช่วงเวลา' : 'เริ่มจองห้องประชุมสำหรับกิจกรรมของคุณได้เลย';
            document.getElementById('resetFilters').hidden = !filtered && document.getElementById('sortFilter').value === 'latest';
            document.getElementById('emptyCreate').hidden = filtered || !bookingLoaded;
            if (bookingLoading && !bookingLoaded) {
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('tableBody').parentNode.classList.remove('hidden');
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6"><div class="booking-loading" role="status"><span></span>กำลังโหลดรายการจองห้องประชุม…</div></td></tr>';
            }
        }
        document.getElementById('searchInput').addEventListener('input', () => { bookingPage=1; filterBookings(); });
        for (const id of ['statusFilter','periodFilter','sortFilter']) document.getElementById(id).addEventListener('change', () => { bookingPage=1; filterBookings(); });
        document.getElementById('resetFilters').addEventListener('click', () => {
            document.getElementById('searchInput').value='';
            document.getElementById('statusFilter').value='all';
            document.getElementById('periodFilter').value='all';
            document.getElementById('sortFilter').value='latest';
            bookingPage=1;filterBookings();document.getElementById('searchInput').focus();
        });
        document.getElementById('previousPage').addEventListener('click', () => { bookingPage--;filterBookings(); });
        document.getElementById('nextPage').addEventListener('click', () => { bookingPage++;filterBookings(); });
        document.getElementById('refreshBookings').addEventListener('click', fetchBookings);
        for (const label of editForm.querySelectorAll('label')) {
            const input=label.nextElementSibling;
            if (input?.matches('input,select')) label.htmlFor=input.id;
        }
        editForm.addEventListener('submit', event => { event.preventDefault();saveChanges(); });
        modal.addEventListener('keydown', event => {
            if (event.key==='Escape') { event.preventDefault();closeModal(); }
            if (event.key==='Tab') {
                const fields=[...modal.querySelectorAll('button,input,select')].filter(node=>!node.disabled && node.type!=='hidden');
                const active=modal.getRootNode().activeElement || document.activeElement;
                if (event.shiftKey && active===fields[0]) {event.preventDefault();fields.at(-1).focus();}
                else if (!event.shiftKey && active===fields.at(-1)) {event.preventDefault();fields[0].focus();}
            }
        });

        let bookingRequest=0;
        async function fetchBookings() {
            const request=++bookingRequest;
            bookingLoading=true;
            document.getElementById('bookingResults').setAttribute('aria-busy','true');
            document.getElementById('refreshBookings').disabled=true;
            document.getElementById('bookingFeedback').hidden=true;
            filterBookings();
            await window.sessionReady;
            if(request!==bookingRequest)return;

            try {
                const response = await fetch(`api/my_bookings.php`);
                const result = await response.json();
                if(request!==bookingRequest)return;
                if (response.ok && result.status === 'success' && Array.isArray(result.data)) {
                    canManageBookings = !!result.is_admin;
                    document.getElementById('bookingListTitle').textContent = canManageBookings ? 'รายการจองทั้งหมด' : 'รายการจองของฉัน';
                    bookings = result.data;
                    bookingLoaded = true;
                    if(bookings.length===1000) {
                        document.getElementById('bookingFeedback').textContent='แสดงสูงสุด 1,000 รายการล่าสุดตามวันใช้งาน';
                        document.getElementById('bookingFeedback').hidden=false;
                    }
                } else {
                    throw new Error(result.message || 'โหลดรายการไม่สำเร็จ');
                }
            } catch (error) {
                if(request!==bookingRequest)return;
                console.error('Error fetching bookings:', error);
                document.getElementById('bookingFeedback').textContent = 'โหลดรายการไม่สำเร็จ กรุณากดโหลดใหม่' + (bookingLoaded ? ' • ขณะนี้แสดงข้อมูลจากการโหลดครั้งก่อน' : '');
                document.getElementById('bookingFeedback').hidden=false;
            } finally {
                if(request===bookingRequest) {
                    bookingLoading=false;
                    document.getElementById('bookingResults').setAttribute('aria-busy','false');
                    document.getElementById('refreshBookings').disabled=false;
                    filterBookings();
                }
            }
        }

        window.onload = () => {
            if(!window.eofficeRegisterModuleRefresh)fetchBookings();
        };
        window.eofficeRegisterModuleRefresh?.(fetchBookings);
    </script>
    </div></div>
</body>
