<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ปฏิทินกำหนดการไปราชการของผู้อำนวยการและรองผู้อำนวยการ ดูสรุปประจำวันและรายการรายเดือน">
  <title>ปฏิทินไปราชการ — E-Office</title>
  <link rel="stylesheet" href="../assets/app-navigation.css?v=20261019">
  <link rel="stylesheet" href="../assets/sidebar.css?v=20261019">
  <link rel="stylesheet" href="../assets/ui-buttons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="calendar.css?v=14">
</head>
<body class="eoffice-module-page">
  <div class="eoffice-module-content"><div class="eoffice-module-view">
    <script src="../assets/app-navigation.js?v=20261112-hidden-tabs&amp;module=official-travel"></script>
    <main class="travel-page" aria-labelledby="travel-title">
      <header class="travel-header">
        <div class="travel-heading">
          <span class="travel-heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7.5 3v4m9-4v4M3 10h18m-12 5 2 2 4-4"/></svg></span>
          <h1 id="travel-title">ปฏิทินไปราชการ</h1>
        </div>
        <div class="travel-header-actions">
          <details id="travel-setup" class="travel-setup" hidden>
            <summary>ตั้งค่าผู้บริหาร</summary>
            <p>ให้ Admin ระบุตำแหน่ง ผอ. หรือรอง ผอ. ในหน้าจัดการสมาชิก</p>
          </details>
          <button id="travel-new" class="eo-btn eo-btn--primary" type="button" aria-label="เพิ่มกำหนดการ" hidden>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="travel-add-full">เพิ่มกำหนดการ</span><span class="travel-add-short" aria-hidden="true">เพิ่ม</span>
          </button>
        </div>
      </header>
      <p id="travel-feedback" class="travel-feedback" role="status">กำลังโหลดปฏิทิน…</p>
      <button id="travel-retry" class="eo-btn eo-btn--secondary" type="button" hidden>โหลดปฏิทินใหม่</button>
      <section class="travel-panel travel-calendar-panel" aria-labelledby="travel-month">
        <div class="travel-toolbar">
          <div class="travel-month-navigation">
            <div class="travel-month-heading">
              <h2 id="travel-month">กำหนดการรายเดือน</h2>
              <p id="travel-result-count" class="travel-muted" role="status"></p>
            </div>
            <div class="travel-controls">
              <button id="travel-prev" class="eo-btn eo-btn--secondary travel-month-arrow" type="button" aria-label="เดือนก่อน"><span aria-hidden="true">‹</span></button>
              <button id="travel-current" class="eo-btn eo-btn--secondary travel-current-button" type="button">วันนี้</button>
              <button id="travel-next" class="eo-btn eo-btn--secondary travel-month-arrow" type="button" aria-label="เดือนถัดไป"><span aria-hidden="true">›</span></button>
            </div>
          </div>
          <div class="travel-view-row">
            <div class="travel-filters" role="group" aria-label="ตัวกรองกำหนดการรายเดือน">
              <select id="travel-department" aria-label="กรองตามฝ่ายบริหาร"></select>
              <select id="travel-person" aria-label="กรองตามผู้ไปราชการ"></select>
              <button id="travel-clear" class="eo-btn eo-btn--secondary" type="button" hidden>ล้างตัวกรอง</button>
            </div>
            <div id="travel-view-controls" class="travel-controls" role="group" aria-label="มุมมองรายเดือน" hidden>
              <button id="travel-view-grid" type="button" class="eo-btn eo-btn--secondary" aria-pressed="true">ปฏิทิน</button>
              <button id="travel-view-list" type="button" class="eo-btn eo-btn--secondary" aria-pressed="false">รายการทั้งเดือน</button>
            </div>
          </div>
        </div>
        <div id="travel-calendar-layout" class="travel-calendar-layout">
          <div id="travel-grid" class="travel-grid" role="group" aria-label="เลือกวันที่ในปฏิทินรายเดือน"></div>
          <section id="travel-selected-panel" class="travel-selected-panel" aria-labelledby="travel-selected-heading">
            <div class="travel-selected-heading" aria-live="polite">
              <div>
                <span class="travel-selected-label">กำหนดการวันที่เลือก</span>
                <h3 id="travel-selected-heading"><time id="travel-selected-date"></time></h3>
                <span id="travel-selected-today" class="travel-today-tag" hidden>วันนี้</span>
              </div>
              <span id="travel-selected-count" class="travel-selected-count"></span>
            </div>
            <div id="travel-selected-body" class="travel-selected-body">
              <div id="travel-selected-items" class="travel-selected-items"></div>
              <div class="travel-empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4m8-4v4M3 10h18m-12 5h6"/></svg>
                <p id="travel-selected-empty" class="travel-muted" hidden></p>
              </div>
            </div>
          </section>
        </div>
        <div id="travel-agenda" class="travel-agenda" aria-label="รายการทั้งเดือน" hidden></div>
        <p id="travel-empty" class="travel-muted" role="status" hidden>ไม่พบกำหนดการในเดือนที่เลือก</p>
      </section>
      <dialog id="travel-detail" class="travel-dialog" aria-labelledby="travel-detail-title">
        <h2 id="travel-detail-title"></h2>
        <dl id="travel-detail-items"></dl>
        <div class="travel-controls">
          <button id="travel-close-detail" class="eo-btn eo-btn--secondary" type="button">ปิด</button>
          <button id="travel-edit" class="eo-btn eo-btn--primary" type="button" hidden>แก้ไขกำหนดการ</button>
        </div>
      </dialog>
      <dialog id="travel-editor" class="travel-dialog" aria-labelledby="travel-editor-title">
        <h2 id="travel-editor-title">เพิ่มกำหนดการ</h2>
        <form id="travel-form">
          <fieldset class="travel-form-grid">
            <legend>ผู้เดินทางและภารกิจ</legend>
            <label>ผู้ไปราชการ <select name="executive_id" required></select></label>
            <label>ฝ่าย <select name="department" required></select></label>
            <label class="travel-wide">เรื่อง / ภารกิจ <input name="subject" required maxlength="200"></label>
            <label class="travel-wide">สถานที่ <input name="place" required maxlength="200"></label>
          </fieldset>
          <fieldset class="travel-form-grid">
            <legend>วันและเวลา</legend>
            <label>วันที่ไป <input name="start_date" type="date" required min="1900-01-01" max="2199-12-31"></label>
            <label>วันที่กลับ <input name="end_date" type="date" required min="1900-01-01" max="2199-12-31"></label>
            <label class="travel-check travel-wide"><input name="all_day" type="checkbox" checked> ทั้งวัน</label>
            <label id="travel-start-time">เวลาไป <input name="start_time" type="time"></label>
            <label id="travel-end-time">เวลากลับ <input name="end_time" type="time"></label>
          </fieldset>
          <fieldset class="travel-form-grid">
            <legend>ข้อมูลเพิ่มเติม</legend>
            <label>เลขที่หนังสือ (ถ้ามี) <input name="reference_no" maxlength="100"></label>
            <label id="travel-status">สถานะ <select name="status"><option value="scheduled">มีกำหนดการ</option><option value="postponed">เลื่อน / รอวันใหม่</option><option value="cancelled">ยกเลิก</option></select></label>
            <label class="travel-wide">หมายเหตุภายใน (เฉพาะผู้จัดการปฏิทิน) <textarea name="private_note" rows="3" maxlength="1000"></textarea></label>
          </fieldset>
          <p id="travel-form-message" class="travel-feedback" role="status"></p>
          <div class="travel-controls">
            <button id="travel-close-editor" class="eo-btn eo-btn--secondary" type="button">ปิดฟอร์ม</button>
            <button id="travel-save" class="eo-btn eo-btn--primary" type="submit">บันทึกกำหนดการ</button>
          </div>
        </form>
      </dialog>
    </main>
  </div></div>
  <script src="calendar.js?v=8"></script>
</body>
</html>
