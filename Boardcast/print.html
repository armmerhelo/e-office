<meta charset="UTF-8">
<div id="receipt" class="receipt-container">
    <h2>ร้าน Gemini Coffee</h2>
    <p>วันที่: 05/01/2026</p>
    <hr>
    <div class="item">
        <span>ลาเต้ร้อน x 1</span>
        <span>60.00</span>
    </div>
    <div class="item">
        <span>คุกกี้ x 2</span>
        <span>40.00</span>
    </div>
    <hr>
    <div class="total">
        <strong>ยอดรวม: 100.00 บาท</strong>
    </div>
    <p style="text-align: center;">ขอบคุณที่ใช้บริการ</p>
</div>

<button onclick="printReceipt()" class="no-print">พิมพ์ใบเสร็จ</button>

<script>
function printReceipt() {
    window.print(); // สั่งเปิดหน้าต่าง Print ของเบราว์เซอร์ทันที
}
</script>

<style>

  /* สไตล์ที่แสดงบนหน้าจอปกติ */
.receipt-container {
    width: 300px;
    padding: 20px;
    border: 1px solid #ddd;
}

/* --- สไตล์สำหรับการปริ้น (สำคัญมาก) --- */
@media print {
    /* 1. ซ่อนทุกอย่างที่ไม่ใช่ใบเสร็จ เช่น ปุ่มกด หรือเมนู */
    body * {
        visibility: hidden;
    }
    
    /* 2. เลือกแสดงเฉพาะส่วน #receipt */
    #receipt, #receipt * {
        visibility: visible;
    }

    /* 3. จัดตำแหน่งให้ใบเสร็จอยู่ชิดขอบบนซ้าย */
    #receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%; /* หรือกำหนดตามขนาดกระดาษความร้อน เช่น 80mm */
        border: none;
    }

    /* 4. ซ่อนส่วนหัว/ท้ายที่เบราว์เซอร์มักจะเติมให้ (วันที่, URL) */
    @page {
        margin: 0;
    }
    .no-print {
        display: none !important;
    }
}
@page {
    size: 80mm auto; /* สำหรับกระดาษหน้ากว้าง 80mm */
    margin: 0;
}
</style>
