<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT All-in-One Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS: จัดการหน้าตาของ Dashboard */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        /* Layout ระบบ Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .value {
            font-size: 3rem;
            font-weight: 700;
            margin: 15px 0;
            color: var(--accent-blue);
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px var(--accent-green);
        }

        /* สไตล์ Chart */
        .chart-section {
            grid-column: 1 / -1; /* ให้กราฟยาวเต็มแถว */
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
        }

        /* สไตล์ปุ่ม Switch */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 4px; bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(24px); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Smart Station 01</h1>
            <p><span class="status-dot"></span> System Online</p>
        </div>
        <div id="clock" style="font-size: 1.2rem; color: #94a3b8;">00:00:00</div>
    </header>

    <div class="grid">
        <div class="card">
            <h3>อุณหภูมิ (°C)</h3>
            <p class="value" id="tempText">24.0</p>
            <progress id="tempBar" value="24" max="50" style="width:100%"></progress>
        </div>

        <div class="card">
            <h3>ความชื้น (%)</h3>
            <p class="value" id="humiText" style="color: var(--accent-green);">55</p>
            <progress id="humiBar" value="55" max="100" style="width:100%"></progress>
        </div>

        <div class="card">
            <h3>การควบคุม</h3>
            <div class="switch-container" style="margin-top: 20px;">
                <span>ไฟห้องทำงาน</span>
                <label class="switch">
                    <input type="checkbox" id="relay1">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="switch-container" style="margin-top: 20px;">
                <span>พัดลมระบายอากาศ</span>
                <label class="switch">
                    <input type="checkbox" id="relay2" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="chart-section">
            <h3>สถิติย้อนหลัง (Real-time)</h3>
            <canvas id="iotChart" height="100"></canvas>
        </div>
    </div>
</div>

<script>
    // --- JavaScript: จัดการข้อมูลและกราฟ ---

    // 1. นาฬิกา
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);

    // 2. ตั้งค่ากราฟ
    const ctx = document.getElementById('iotChart').getContext('2d');
    const iotChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                label: 'Temperature',
                data: [],
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56, 189, 248, 0.1)',
                fill: true,
                tension: 0.4
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: false, grid: { color: '#334155' } },
                x: { grid: { display: false } }
            },
            plugins: { legend: { labels: { color: '#f8fafc' } } }
        }
    });

    // 3. จำลองการรับข้อมูล (Mock Data)
    function simulateSensorReadings() {
        // สุ่มตัวเลข 20-30
        const newTemp = (Math.random() * (30 - 22) + 22).toFixed(1);
        const newHumi = Math.floor(Math.random() * (70 - 40) + 40);

        // อัปเดตตัวเลขบนหน้าจอ
        document.getElementById('tempText').innerText = newTemp;
        document.getElementById('tempBar').value = newTemp;
        document.getElementById('humiText').innerText = newHumi;
        document.getElementById('humiBar').value = newHumi;

        // อัปเดตกราฟ
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        if (iotChart.data.labels.length > 15) {
            iotChart.data.labels.shift();
            iotChart.data.datasets[0].data.shift();
        }

        iotChart.data.labels.push(timeNow);
        iotChart.data.datasets[0].data.push(newTemp);
        iotChart.update('none'); // update แบบไม่ต้องทำ animation ซ้ำซ้อนเพื่อความลื่นไหล
    }

    // ทำงานทุก 2 วินาที
    setInterval(simulateSensorReadings, 2000);

    // 4. ตัวอย่างการดักจับการคลิกสวิตช์
    document.getElementById('relay1').addEventListener('change', (e) => {
        console.log("Relay 1 is now: " + (e.target.checked ? "ON" : "OFF"));
        // ตรงนี้สามารถใส่คำสั่ง fetch() เพื่อสั่งเปิดปิดไฟจริงผ่าน API ได้
    });
</script>

</body>
</html>
