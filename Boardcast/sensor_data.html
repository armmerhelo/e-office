<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Real-time Sensor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .current-values { display: flex; justify-content: space-around; margin-bottom: 20px; }
        .box { text-align: center; padding: 10px; border-radius: 8px; background: #f8f9fa; width: 30%; }
        .box h3 { margin: 0; font-size: 0.9rem; color: #666; }
        .box p { margin: 5px 0 0; font-size: 1.5rem; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>Sensor Monitor (Real-time)</h2>

    <div class="current-values">
        <div class="box"><h3>Temp</h3><p id="txt-temp">--</p></div>
        <div class="box"><h3>Humidity</h3><p id="txt-humid">--</p></div>
        <div class="box"><h3>Moisture</h3><p id="txt-moist">--</p></div>
    </div>

    <canvas id="sensorChart"></canvas>
</div>

<script>
    const API_URL = 'https://e-office.siya.ac.th/sensor.php';
    let chart;

    async function initChart() {
        try {
            // 1. โหลดข้อมูล 20 ตัวแรก
            const response = await fetch(API_URL);
            const data = await response.json();

            const labels = data.map(item => item.ID);
            const temps = data.map(item => item.Temp);
            const humids = data.map(item => item.Humidity);

            const ctx = document.getElementById('sensorChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Temp (°C)', data: temps, borderColor: '#e74c3c', tension: 0.3 },
                        { label: 'Humid (%)', data: humids, borderColor: '#3498db', tension: 0.3 }
                    ]
                },
                options: { animation: { duration: 500 } }
            });

            // 2. เริ่มดึงเฉพาะค่าล่าสุดทุก 5 วินาที
            setInterval(updateLatest, 5000);
        } catch (err) { console.error("Initial load failed", err); }
    }

    async function updateLatest() {
        try {
            const response = await fetch(`${API_URL}?mode=latest`);
            const latest = await response.json();

            // แสดงตัวเลขปัจจุบันด้านบน
            document.getElementById('txt-temp').innerText = latest.Temp + " °C";
            document.getElementById('txt-humid').innerText = latest.Humidity + " %";
            document.getElementById('txt-moist').innerText = latest.Moisture + " %";

            // ป้องกันข้อมูลซ้ำ (เช็คจาก ID)
            const lastIndex = chart.data.labels.length - 1;
            if (chart.data.labels[lastIndex] == latest.ID) return;

            // เพิ่มข้อมูลใหม่เข้ากราฟ
            chart.data.labels.push(latest.ID);
            chart.data.datasets[0].data.push(latest.Temp);
            chart.data.datasets[1].data.push(latest.Humidity);

            // ถ้าเกิน 20 จุด ให้ลบจุดเก่าออกเพื่อให้กราฟเลื่อน (Rolling)
            if (chart.data.labels.length > 20) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
                chart.data.datasets[1].data.shift();
            }

            chart.update('none'); // อัปเดตแบบลื่นไหล
        } catch (err) { console.error("Update failed", err); }
    }

    initChart();
</script>
</body>
</html>
